name: Build Snake Game

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v6

      - name: Get J2ME build environment
        run: |
          git clone https://github.com/retro-systems-lab/j2me-devkit.git j2me-devkit

      - name: Copy Snake source
        run: |
          cp src/Snake.java j2me-devkit/src/Snake.java

      - name: Build J2ME game
        working-directory: j2me-devkit
        run: |
          make setup
          make build

      - name: Upload Snake JAR and JAD
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Game
          path: |
            j2me-devkit/dist/app.jar
            j2me-devkit/app.jad